<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kilit Kırma</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1B1D21;
    --panel:#24272C;
    --panel-2:#2C3036;
    --line:#383C42;
    --brass:#C9A24D;
    --brass-dim:#8C7534;
    --teal:#4C8A7D;
    --text:#ECE8DF;
    --text-dim:#9C9A93;
    --success:#7CB690;
    --danger:#C1665C;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:32px 16px 80px;
  }
  .wrap{width:100%;max-width:460px;}
  h1,h2,h3{font-family:'Space Grotesk',sans-serif;margin:0;}
  .brand{
    display:flex;align-items:center;gap:12px;justify-content:center;
    margin-bottom:6px;
  }
  .brand h1{font-size:26px;font-weight:700;letter-spacing:0.3px;}
  .tagline{
    text-align:center;color:var(--text-dim);font-size:13px;
    margin-bottom:32px;
  }
  .card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:14px;
    padding:24px;
    margin-bottom:16px;
  }
  .screen{display:none;}
  .screen.active{display:block;}
  label{
    display:block;font-size:12px;color:var(--text-dim);
    text-transform:uppercase;letter-spacing:0.6px;margin-bottom:8px;
  }
  input[type=text]{
    width:100%;
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:8px;
    color:var(--text);
    font-family:'JetBrains Mono',monospace;
    font-size:20px;
    letter-spacing:4px;
    padding:12px 14px;
    text-align:center;
    outline:none;
  }
  input[type=text]:focus{border-color:var(--brass);}
  input[type=text].name-input{
    font-family:'Inter',sans-serif;
    letter-spacing:0;
    font-size:15px;
    text-align:left;
  }
  button{
    font-family:'Space Grotesk',sans-serif;
    font-weight:600;
    font-size:14px;
    border-radius:8px;
    border:1px solid var(--brass-dim);
    background:var(--brass);
    color:#26210F;
    padding:12px 18px;
    cursor:pointer;
    width:100%;
    margin-top:14px;
    transition:transform .1s ease, opacity .15s ease;
  }
  button:hover{opacity:0.92;}
  button:active{transform:scale(0.98);}
  button.secondary{
    background:transparent;
    color:var(--text);
    border:1px solid var(--line);
  }
  button:disabled{
    opacity:0.4;
    cursor:not-allowed;
  }
  .slot-row{
    display:flex;gap:10px;margin-top:6px;
  }
  .slot{
    flex:1;
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:10px;
    padding:14px 10px;
    text-align:center;
    cursor:pointer;
  }
  .slot.taken{cursor:default;opacity:0.7;}
  .slot .role-label{font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.5px;}
  .slot .role-name{font-family:'Space Grotesk';font-weight:600;margin-top:4px;font-size:15px;}
  .hint{font-size:12px;color:var(--text-dim);margin-top:10px;line-height:1.5;}
  .room-chip{
    display:flex;align-items:center;justify-content:center;gap:10px;
    background:var(--panel-2);border:1px dashed var(--brass-dim);
    border-radius:10px;padding:10px 14px;margin-bottom:20px;
  }
  .room-chip .code{font-family:'JetBrains Mono';font-weight:700;letter-spacing:3px;color:var(--brass);font-size:16px;}
  .room-chip button{width:auto;margin:0;padding:6px 10px;font-size:12px;}
  .status-bar{
    display:flex;justify-content:space-between;align-items:center;
    margin-bottom:18px;
  }
  .player-pill{
    display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-dim);
  }
  .player-pill.me{color:var(--text);font-weight:600;}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--line);}
  .dot.ready{background:var(--success);}
  .mode-banner{
    background:var(--panel-2);
    border-left:3px solid var(--brass);
    border-radius:6px;
    padding:12px 14px;
    font-size:13px;
    color:var(--text);
    margin-bottom:18px;
    line-height:1.5;
  }
  .mode-banner b{color:var(--brass);}
  .guess-row{display:flex;gap:10px;align-items:flex-end;}
  .guess-row input{flex:1;}
  .guess-row button{width:auto;margin-top:0;white-space:nowrap;padding:12px 16px;}
  table.history{width:100%;border-collapse:collapse;margin-top:18px;font-size:14px;}
  table.history th{
    text-align:left;font-size:11px;color:var(--text-dim);
    text-transform:uppercase;letter-spacing:0.5px;
    padding-bottom:8px;border-bottom:1px solid var(--line);
  }
  table.history td{
    padding:9px 4px;border-bottom:1px solid var(--line);
    font-family:'JetBrains Mono';
  }
  table.history td.count{font-weight:700;color:var(--brass);font-family:'Space Grotesk';}
  .empty-history{color:var(--text-dim);font-size:13px;padding:14px 0;text-align:center;}
  .win-banner{
    text-align:center;padding:22px 10px;
  }
  .win-banner h2{font-size:20px;color:var(--brass);margin-bottom:6px;}
  .win-banner p{color:var(--text-dim);font-size:13px;margin:0;}
  .lock-icon{flex-shrink:0;}
  .spinner{
    width:16px;height:16px;border-radius:50%;
    border:2px solid var(--line);border-top-color:var(--brass);
    animation:spin 0.8s linear infinite;display:inline-block;vertical-align:middle;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .error-text{color:var(--danger);font-size:13px;margin-top:8px;min-height:16px;}
  .center-wait{text-align:center;padding:30px 0;color:var(--text-dim);font-size:14px;}
</style>
</head>
<body>
<div class="wrap">

  <div class="brand">
    <svg class="lock-icon" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#C9A24D" stroke-width="1.8">
      <rect x="4" y="11" width="16" height="10" rx="2"/>
      <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      <circle cx="12" cy="16" r="1.6" fill="#C9A24D"/>
    </svg>
    <h1>Kilit Kırma</h1>
  </div>
  <p class="tagline">Sayını kilitle, sevgilininkini kır.</p>

  <!-- ROOM JOIN -->
  <div class="screen active" id="screen-join">
    <div class="card">
      <label for="roomInput">Oda kodu</label>
      <input type="text" id="roomInput" maxlength="8" placeholder="ör. ASKIM1" autocomplete="off">
      <button onclick="joinRoom()">Odaya gir</button>
      <p class="hint">Aynı kodu ikiniz de girin. Kod yoksa otomatik oluşturulur.</p>
      <p class="error-text" id="joinError"></p>
    </div>
  </div>

  <!-- CHOOSE IDENTITY -->
  <div class="screen" id="screen-name">
    <div class="card">
      <div class="room-chip">
        <span class="code" id="roomChipCode"></span>
        <button class="secondary" onclick="copyRoomCode()">Kopyala</button>
      </div>
      <label for="nameInput">Adın</label>
      <input type="text" id="nameInput" class="name-input" placeholder="Adını yaz" autocomplete="off">
      <label style="margin-top:18px;">Sen kimsin?</label>
      <div class="slot-row">
        <div class="slot" id="slotP1" onclick="claimSlot('p1')">
          <div class="role-label">1. Oyuncu</div>
          <div class="role-name" id="slotP1Name">boş</div>
        </div>
        <div class="slot" id="slotP2" onclick="claimSlot('p2')">
          <div class="role-label">2. Oyuncu</div>
          <div class="role-name" id="slotP2Name">boş</div>
        </div>
      </div>
      <p class="error-text" id="nameError"></p>
    </div>
  </div>

  <!-- SET SECRET -->
  <div class="screen" id="screen-secret">
    <div class="card">
      <div class="room-chip">
        <span class="code" id="roomChipCode2"></span>
        <button class="secondary" onclick="copyRoomCode()">Kopyala</button>
      </div>
      <label for="secretInput">Kilitlenecek 4 haneli sayın</label>
      <input type="text" id="secretInput" maxlength="4" placeholder="1234" autocomplete="off">
      <button onclick="submitSecret()">Sayımı kilitle</button>
      <p class="hint">Bu sayıyı sadece sen göreceksin. Kilitledikten sonra değiştirilemez.</p>
      <p class="error-text" id="secretError"></p>
    </div>
  </div>

  <!-- WAITING -->
  <div class="screen" id="screen-wait">
    <div class="card">
      <div class="center-wait">
        <span class="spinner"></span>
        <p id="waitText" style="margin-top:14px;">Rakibinin sayısını kilitlemesi bekleniyor...</p>
      </div>
    </div>
  </div>

  <!-- GAME -->
  <div class="screen" id="screen-game">
    <div class="card">
      <div class="status-bar">
        <div class="player-pill" id="pillP1"><span class="dot"></span><span></span></div>
        <div class="player-pill" id="pillP2"><span class="dot"></span><span></span></div>
      </div>

      <div id="winnerBox"></div>

      <div id="activeGameArea">
        <div class="mode-banner" id="modeBanner"></div>
        <div class="guess-row">
          <input type="text" id="guessInput" maxlength="4" placeholder="1234" autocomplete="off">
          <button onclick="submitGuess()" id="guessBtn">Tahmin et</button>
        </div>
        <p class="error-text" id="guessError"></p>
      </div>

      <table class="history" id="historyTable">
        <thead><tr><th>Tahminin</th><th>Sonuç</th></tr></thead>
        <tbody id="historyBody"></tbody>
      </table>
      <div class="empty-history" id="emptyHistory" style="display:none;">Henüz tahmin yok.</div>
    </div>
    <button class="secondary" onclick="newRound()">Yeni oyun başlat</button>
  </div>

</div>

<script>
let roomCode = null;
let myRole = null;
let myName = '';
let roomState = null;
let pollTimer = null;

function storageKey(code){ return 'kilitkirma:' + code; }

function defaultRoom(){
  return {
    p1: { name: '', secret: null },
    p2: { name: '', secret: null },
    history: { p1: [], p2: [] },
    foundAll: { p1: false, p2: false },
    winner: null
  };
}

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

async function joinRoom(){
  const raw = document.getElementById('roomInput').value.trim().toUpperCase();
  const errEl = document.getElementById('joinError');
  errEl.textContent = '';
  if(!raw || raw.length < 3){
    errEl.textContent = 'Lütfen en az 3 karakterlik bir oda kodu gir.';
    return;
  }
  roomCode = raw;
  try{
    const res = await window.storage.get(storageKey(roomCode), true);
    roomState = res ? JSON.parse(res.value) : defaultRoom();
  }catch(e){
    roomState = defaultRoom();
  }
  await saveRoom();
  document.getElementById('roomChipCode').textContent = roomCode;
  document.getElementById('roomChipCode2').textContent = roomCode;
  showScreen('screen-name');
  renderSlots();
  startPolling();
}

async function saveRoom(){
  try{
    await window.storage.set(storageKey(roomCode), JSON.stringify(roomState), true);
  }catch(e){
    console.error('Kaydetme hatası', e);
  }
}

async function refreshRoom(){
  if(!roomCode) return;
  try{
    const res = await window.storage.get(storageKey(roomCode), true);
    if(res) roomState = JSON.parse(res.value);
  }catch(e){}
  onRoomUpdated();
}

function renderSlots(){
  const p1n = roomState.p1.name;
  const p2n = roomState.p2.name;
  document.getElementById('slotP1Name').textContent = p1n || 'boş';
  document.getElementById('slotP2Name').textContent = p2n || 'boş';
  document.getElementById('slotP1').classList.toggle('taken', !!p1n && myRole !== 'p1');
  document.getElementById('slotP2').classList.toggle('taken', !!p2n && myRole !== 'p2');
}

async function claimSlot(role){
  const errEl = document.getElementById('nameError');
  errEl.textContent = '';
  const name = document.getElementById('nameInput').value.trim();
  if(!name){
    errEl.textContent = 'Önce adını yaz.';
    return;
  }
  await refreshRoom();
  if(roomState[role].name && roomState[role].name !== name){
    errEl.textContent = 'Bu koltuk zaten ' + roomState[role].name + ' tarafından alınmış.';
    renderSlots();
    return;
  }
  roomState[role].name = name;
  myRole = role;
  myName = name;
  await saveRoom();
  routeAfterIdentity();
}

function routeAfterIdentity(){
  if(!roomState[myRole].secret){
    showScreen('screen-secret');
  }else{
    checkGameReady();
  }
}

async function submitSecret(){
  const val = document.getElementById('secretInput').value.trim();
  const errEl = document.getElementById('secretError');
  errEl.textContent = '';
  if(!/^\d{4}$/.test(val)){
    errEl.textContent = 'Tam olarak 4 rakam gir (0-9).';
    return;
  }
  await refreshRoom();
  roomState[myRole].secret = val;
  await saveRoom();
  checkGameReady();
}

function opponentRole(){ return myRole === 'p1' ? 'p2' : 'p1'; }

function checkGameReady(){
  const opp = opponentRole();
  if(roomState[opp].secret){
    showScreen('screen-game');
    renderGame();
  }else{
    const oppName = roomState[opp].name || 'Rakibin';
    document.getElementById('waitText').textContent = oppName + ' henüz sayısını kilitlemedi...';
    showScreen('screen-wait');
  }
}

function onRoomUpdated(){
  const activeScreen = document.querySelector('.screen.active');
  if(!activeScreen) return;
  const id = activeScreen.id;
  if(id === 'screen-name'){
    renderSlots();
  }else if(id === 'screen-wait'){
    checkGameReady();
  }else if(id === 'screen-game'){
    renderGame();
  }
}

function countVar(secret, guess){
  const secretArr = secret.split('');
  const used = new Array(4).fill(false);
  let count = 0;
  for(const g of guess.split('')){
    const idx = secretArr.findIndex((s,i) => s === g && !used[i]);
    if(idx !== -1){ used[idx] = true; count++; }
  }
  return count;
}

function countPos(secret, guess){
  let count = 0;
  for(let i=0;i<4;i++) if(secret[i] === guess[i]) count++;
  return count;
}

async function submitGuess(){
  const errEl = document.getElementById('guessError');
  errEl.textContent = '';
  const val = document.getElementById('guessInput').value.trim();
  if(!/^\d{4}$/.test(val)){
    errEl.textContent = 'Tam olarak 4 rakam gir (0-9).';
    return;
  }
  await refreshRoom();
  if(roomState.winner){
    renderGame();
    return;
  }
  const opp = opponentRole();
  const oppSecret = roomState[opp].secret;
  if(!oppSecret){
    errEl.textContent = 'Rakibin henüz sayısını kilitlemedi.';
    return;
  }
  const mode = roomState.foundAll[myRole] ? 'pos' : 'var';
  let c, entry;
  if(mode === 'var'){
    c = countVar(oppSecret, val);
    entry = { guess: val, count: c, mode: 'var' };
    if(c === 4) roomState.foundAll[myRole] = true;
  }else{
    c = countPos(oppSecret, val);
    entry = { guess: val, count: c, mode: 'pos' };
    if(c === 4) roomState.winner = myRole;
  }
  roomState.history[myRole].push(entry);
  await saveRoom();
  document.getElementById('guessInput').value = '';
  renderGame();
}

function renderGame(){
  const opp = opponentRole();
  const meName = roomState[myRole].name || 'Sen';
  const oppName = roomState[opp].name || 'Rakip';

  const pillMe = document.getElementById(myRole === 'p1' ? 'pillP1' : 'pillP2');
  const pillOpp = document.getElementById(opp === 'p1' ? 'pillP1' : 'pillP2');
  pillMe.className = 'player-pill me';
  pillMe.querySelector('span:last-child').textContent = meName + ' (sen)';
  pillMe.querySelector('.dot').classList.toggle('ready', !!roomState[myRole].secret);
  pillOpp.className = 'player-pill';
  pillOpp.querySelector('span:last-child').textContent = oppName;
  pillOpp.querySelector('.dot').classList.toggle('ready', !!roomState[opp].secret);

  const winnerBox = document.getElementById('winnerBox');
  const activeArea = document.getElementById('activeGameArea');
  if(roomState.winner){
    activeArea.style.display = 'none';
    const iWon = roomState.winner === myRole;
    winnerBox.innerHTML = '<div class="win-banner"><h2>' + (iWon ? 'Kilidi kırdın!' : (oppName + ' kilidi kırdı!')) + '</h2><p>' + (iWon ? (oppName + ' sayısı: ' + roomState[opp].secret) : ('Senin sayın: ' + roomState[myRole].secret)) + '</p></div>';
  }else{
    winnerBox.innerHTML = '';
    activeArea.style.display = 'block';
    const mode = roomState.foundAll[myRole] ? 'pos' : 'var';
    const banner = document.getElementById('modeBanner');
    if(mode === 'var'){
      banner.innerHTML = '<b>Aşama 1 — sayı avı.</b> Tahmininde ' + oppName + ' sayısında geçen kaç rakam olduğunu göreceksin, yerleri önemli değil.';
    }else{
      banner.innerHTML = '<b>Aşama 2 — konum avı.</b> Doğru rakamları buldun, artık sadece doğru sırada olanlar sayılır. 4/4 olunca kilidi kırarsın.';
    }
    if(!roomState[opp].secret){
      document.getElementById('guessBtn').disabled = true;
    }else{
      document.getElementById('guessBtn').disabled = false;
    }
  }

  const hist = roomState.history[myRole] || [];
  const body = document.getElementById('historyBody');
  const empty = document.getElementById('emptyHistory');
  const table = document.getElementById('historyTable');
  if(hist.length === 0){
    table.style.display = 'none';
    empty.style.display = 'block';
  }else{
    table.style.display = 'table';
    empty.style.display = 'none';
    body.innerHTML = hist.slice().reverse().map(h => {
      const label = h.mode === 'var' ? (h.count + ' / 4 sayı var') : (h.count + ' / 4 doğru yerde');
      return '<tr><td>' + h.guess + '</td><td class="count">' + label + '</td></tr>';
    }).join('');
  }
}

async function newRound(){
  await refreshRoom();
  roomState.p1.secret = null;
  roomState.p2.secret = null;
  roomState.history = { p1: [], p2: [] };
  roomState.foundAll = { p1: false, p2: false };
  roomState.winner = null;
  await saveRoom();
  document.getElementById('secretInput').value = '';
  routeAfterIdentity();
}

function copyRoomCode(){
  if(navigator.clipboard && roomCode){
    navigator.clipboard.writeText(roomCode);
  }
}

function startPolling(){
  if(pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(refreshRoom, 2200);
}

document.getElementById('roomInput').addEventListener('keydown', e => { if(e.key === 'Enter') joinRoom(); });
document.getElementById('nameInput').addEventListener('keydown', e => { if(e.key === 'Enter') e.preventDefault(); });
document.getElementById('secretInput').addEventListener('keydown', e => { if(e.key === 'Enter') submitSecret(); });
document.getElementById('secretInput').addEventListener('input', e => { e.target.value = e.target.value.replace(/\D/g,'').slice(0,4); });
document.getElementById('guessInput').addEventListener('keydown', e => { if(e.key === 'Enter') submitGuess(); });
document.getElementById('guessInput').addEventListener('input', e => { e.target.value = e.target.value.replace(/\D/g,'').slice(0,4); });
</script>
</body>
</html>
