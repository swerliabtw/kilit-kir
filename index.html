<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kilit Kırma - Bo3 Seri Yarışı</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #1B1D21; --panel: #24272C; --brass: #C9A24D; --text: #ECE8DF; --success: #7CB690; }
    body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; display: flex; justify-content: center; padding: 20px; }
    .wrap { width: 100%; max-width: 460px; }
    .card { background: var(--panel); border-radius: 14px; padding: 24px; margin-bottom: 16px; border: 1px solid #383C42; }
    .screen { display: none; } .screen.active { display: block; }
    .score-board { display: flex; justify-content: space-around; font-family: 'Space Grotesk'; font-size: 20px; margin-bottom: 20px; color: var(--brass); background: #1B1D21; padding: 10px; border-radius: 8px; }
    input { width: 100%; background: #2C3036; border: 1px solid #383C42; color: white; padding: 12px; border-radius: 8px; text-align: center; font-size: 20px; font-family: 'JetBrains Mono'; }
    button { width: 100%; padding: 12px; background: var(--brass); border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px; color: #26210F; }
  </style>
</head>
<body>
<div class="wrap">
  <div id="screen-game" class="screen active">
    <div class="card">
      <div class="score-board" id="scoreBoard">Sen 0 - 0 Rakip</div>
      <div id="gameUI">
        <input type="text" id="guessInput" maxlength="4" placeholder="1234">
        <button onclick="submitGuess()">Tahmin Et</button>
      </div>
      <div id="winnerBox"></div>
      <button class="secondary" onclick="newRound()">Sonraki Tura Geç</button>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
  import { getFirestore, doc, updateDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDz_aIJTEXXFkfDvgf62D4iK6VTZNWbM8U",
    authDomain: "kilitkir.firebaseapp.com",
    projectId: "kilitkir",
    storageBucket: "kilitkir.firebasestorage.app",
    messagingSenderId: "250815950852",
    appId: "1:250815950852:web:de08ec1b2839733de18551"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  
  let roomCode = "TESTODA"; // Örnek oda
  let myRole = "p1"; // Test için p1
  let roomState = { scores: { p1: 0, p2: 0 }, winner: null };

  window.submitGuess = async () => {
    const val = document.getElementById('guessInput').value;
    const opp = myRole === 'p1' ? 'p2' : 'p1';
    
    if (roomState[opp] && val === roomState[opp].secret) {
        const newScore = (roomState.scores[myRole] || 0) + 1;
        await updateDoc(doc(db, 'rooms', roomCode), {
            [`scores.${myRole}`]: newScore,
            winner: myRole
        });
        alert(newScore >= 2 ? "SERİYİ KAZANDIN!" : "Turu kazandın!");
    }
  };

  window.newRound = async () => {
    await updateDoc(doc(db, 'rooms', roomCode), {
        "p1.secret": null,
        "p2.secret": null,
        winner: null,
        history: { p1: [], p2: [] }
    });
  };

  function renderGame() {
    if (!roomState) return;
    document.getElementById('scoreBoard').textContent = 
      `Sen ${roomState.scores[myRole] || 0} - ${roomState.scores[myRole === 'p1' ? 'p2' : 'p1'] || 0} Rakip`;
    
    document.getElementById('gameUI').style.display = roomState.winner ? 'none' : 'block';
  }
</script>
</body>
</html>
